<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Paneli</title>
  <link rel="icon" type="image/x-icon" href="icon.ico">
  
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f6f5f3;
    }

 
    nav {
      background-color: #15151e;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 40px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .nav-content {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      justify-content: space-between;
    }

    .nav-left, .nav-right {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-item {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .nav-item:hover {
      opacity: 0.7;
    }

   
    .content-box {
      background-color: #ffffff;
      margin: 60px auto;
      padding: 60px 80px;
      max-width: 1200px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content-box h2 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    .content-box p {
      font-size: 18px;
      line-height: 1.6;
      max-width: 800px;
    }

    
    @media (max-width: 768px) {
      .nav-content {
        flex-direction: column;
        align-items: center;
      }

      .content-box {
        padding: 40px 20px;
      }

      .nav-left, .nav-right {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-content">
      <div class="nav-left">
        <a href="admin-panel.html" class="nav-item">Admin Paneli</a>
        <a href="bildirim.html" class="nav-item">Bildirimler</a>
      </div>
      <div class="nav-right">
        <a href="hakkimda.html" class="nav-item">Kullanıcı Görünümüne Dön</a>
      </div>
    </div>
  </nav>

  
  <section class="content-box">
    <h2>Admin Paneli</h2>
    <p>Burada admin paneli yönetim işlevlerini gerçekleştirebilirsiniz. Bildirimleri kontrol edebilir ve gerekli düzenlemeleri yapabilirsiniz.</p>
  </section>

</body>
</html>
